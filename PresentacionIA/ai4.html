<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">

  <title>La Magia de la IA: De Teoría a Agentes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #fee440;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      padding: 20px 15px 90px 15px;
    }

    /* Fondo animado SVG */
    svg.bg-blobs {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1;
      pointer-events: none;
    }
    @keyframes rotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .out-top { animation: rotate 20s linear infinite; transform-origin: 13px 25px; }
    .in-top { animation: rotate 10s linear infinite; transform-origin: 13px 25px; }
    .out-bottom { animation: rotate 25s linear infinite; transform-origin: 84px 93px; }
    .in-bottom { animation: rotate 15s linear infinite; transform-origin: 84px 93px; }

    /* Barra de progreso */
    .progress-bar-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 6px;
      background: rgba(0, 0, 0, 0.12); z-index: 50;
    }
    .progress-bar { height: 100%; background: #9b5de5; width: 0%; transition: width 0.3s ease; }

    /* Tarjeta principal */
    .slide-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1150px;
      min-height: 520px;
      height: 80vh;
      max-height: 750px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 24px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.18);
      border: 2px solid rgba(255, 255, 255, 0.65);
      display: flex;
      overflow: hidden;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    .layout-right { flex-direction: row; }
    .layout-left { flex-direction: row-reverse; }

    /* Bloque de texto */
    .content-box {
      flex: 1.15;
      padding: clamp(24px, 4vw, 50px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow-y: auto;
    }

    .topic-tag {
      font-size: 13px;
      font-weight: 800;
      color: #9b5de5;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(24px, 3.2vw, 42px);
      color: #0f172a;
      line-height: 1.22;
      margin-bottom: 18px;
      font-weight: 800;
    }

    p.description {
      font-size: clamp(16px, 1.8vw, 24px);
      color: #334155;
      line-height: 1.5;
      font-weight: 500;
    }

    /* Bloque de imagen */
    .image-box {
      flex: 1;
      width: 50%;
      min-width: 40%;
      height: 100%;
      background: #0f172a;
      position: relative;
      overflow: hidden;
    }

    .image-box img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      transition: opacity 0.3s ease;
    }

    /* Guión del orador */
    .speaker-notes-drawer {
      margin-top: 20px;
      padding: 14px 16px;
      background: rgba(241, 245, 249, 0.95);
      border-left: 4px solid #00bbf9;
      border-radius: 8px;
      font-size: 14px;
      color: #475569;
      line-height: 1.45;
      display: none;
    }
    .speaker-notes-drawer.visible { display: block; }

    /* Controles */
    .controls {
      position: fixed;
      bottom: 16px;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 8px 18px;
      border-radius: 50px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    button.nav-btn {
      background: #0f172a;
      color: #ffffff;
      border: none;
      width: 40px; height: 40px;
      border-radius: 50%;
      font-size: 17px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }
    button.nav-btn:hover { background: #9b5de5; transform: scale(1.08); }

    .btn-action {
      background: #f1f5f9;
      color: #0f172a;
      border: 1px solid #cbd5e1;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-action:hover { background: #e2e8f0; }

    .slide-counter { font-size: 14px; font-weight: 700; color: #0f172a; min-width: 65px; text-align: center; }

    /* Responsividad */
    @media (max-width: 850px) {
      body { justify-content: flex-start; padding: 16px 12px 85px 12px; overflow-y: auto; }
      .slide-wrapper { height: auto; min-height: auto; max-height: none; flex-direction: column !important; }
      .image-box { width: 100%; min-width: 100%; height: 230px; order: 1; }
      .content-box { width: 100%; padding: 22px 18px; order: 2; }
      .btn-action span.label-text { display: none; }
    }
  </style>
</head>

  <script>
    // 83 DIAPOSITIVAS DE LA NUEVA PRESENTACIÓN CON LAS RUTAS LOCALES IMG/
    const slides = [
      { t: "La Magia de la IA", d: "De Teoría a Agentes", img: "img/Ilustration_V2_Create_an_image_to_represent_a_magic_of_IA_0.jpg", n: "Bienvenidos. Hoy realizaremos un viaje fascinante por el presente y futuro de la Inteligencia Artificial: desde sus fundamentos teóricos hasta la revolución de los agentes autónomos." },
      { t: "Introducción", d: "Conceptos clave para comprender la revolución inteligente actual", img: "img/3D_Animation_Style_Create_an_image_illustrating_the_concept_of_0.jpg", n: "Para entender hacia dónde vamos, primero debemos desmitificar qué es realmente esta tecnología y cómo ha cambiado nuestra forma de procesar el conocimiento." },
      { t: "¿Qué es la Inteligencia?", d: "Capacidad mental de procesar, comprender, aplicar y adaptar conocimiento", img: "img/Ilustration_V2_Create_an_image_to_represent_a_magic_of_Generat_0.jpg", n: "La inteligencia humana no es solo acumular datos; es la capacidad de razonar, aprender de los errores y adaptarse a entornos cambiantes." },
      { t: "Neurona Biológica", d: "El cerebro humano procesa información mediante 86 mil millones de neuronas", img: "img/Ilustration_V2_A_real_neuron_like_a_scientific_image_0.jpg", n: "Nuestra biología es extraordinaria. El cerebro humano alberga aproximadamente 86 mil millones de neuronas interconectadas en una red eléctrica altamente eficiente." },
      { t: "Biología vs. Computación", d: "Billones de sinapsis biológicas superan la complejidad actual sintética", img: "img/Absolute_Reality_v16_A_with_neuron_synapsis_like_a_scientific_0.jpg", n: "Aunque la computación moderna es extremadamente rápida, la densidad de conexiones de nuestro cerebro sigue superando a los supercomputadores más avanzados." },
      { t: "¿Qué es la IA?", d: "Algoritmos que permiten a máquinas analizar datos y decidir", img: "img/3D_Animation_Style_Generate_an_image_representing_the_concept_0.jpg", n: "La Inteligencia Artificial busca emular estas capacidades mediante ecuaciones y algoritmos capaces de analizar información y tomar decisiones." },
      { t: "Funcionamiento de la IA", d: "Sistemas que reconocen patrones complejos y aprenden de datos", img: "img/DreamShaper_v7_Illustrate_the_process_of_How_AI_Works_showing_0.jpg", n: "A diferencia del software tradicional, la IA no se programa regla por regla, sino que detecta patrones ocultos en grandes volúmenes de datos." },
      { t: "La Neurona Artificial", d: "Unidad básica matemática que procesa y pondera entradas numéricas", img: "img/Absolute_Reality_v16_An_artificial_neuron_from_IA_0.jpg", n: "El bloque fundamental es la neurona artificial: una fórmula matemática que recibe datos, les asigna un peso de importancia y genera una salida." },
      { t: "Redes Neuronales", d: "Capas interconectadas de nodos procesando información en paralelo", img: "img/neuroIA.png", n: "Al agrupar miles de estas neuronas en capas, creamos redes neuronales capaces de realizar cálculos masivos en paralelo." },
      { t: "Función de Pérdida / Loss", d: "Medida matemática del error entre predicción y valor real", img: "img/perdida.jpg", n: "¿Cómo aprende la IA? Mediante la función de pérdida, un indicador matemático que calcula qué tan lejos estuvo la máquina de la respuesta correcta." },
      { t: "Machine Learning", d: "Algoritmos que optimizan parámetros automáticamente a partir de datos", img: "img/Absolute_Reality_v16_Generate_an_image_illustrating_the_concep_0.jpg", n: "El Machine Learning es el proceso por el cual el algoritmo ajusta sus propios parámetros automáticamente para reducir ese error con cada intento." },
      { t: "Deep Learning", d: "Aprendizaje profundo mediante múltiples capas ocultas de abstracción", img: "img/cerebros8NeuroIA.png", n: "El Deep Learning lleva esto más lejos, usando múltiples capas ocultas para entender conceptos abstractos, como reconocer un rostro o traducir un idioma." },
      { t: "Historia de la IA", d: "Orígenes teóricos y grandes hitos de la computación inteligente", img: "img/historia_ia.jpg", n: "Repasemos ahora la historia: un camino de más de siete décadas marcado por grandes avances y momentos de estancamiento." },
      { t: "Los Inicios - 1950s", d: "Alan Turing propone computadoras capaces de pensamiento humano", img: "img/pioneros.png", n: "En los años 50, Alan Turing planteó una pregunta visionaria: ¿pueden las máquinas pensar como los seres humanos?" },
      { t: "El Test de Turing", d: "Evaluación de imitación conversacional entre humano y máquina", img: "img/pioneros.png", n: "Para responderlo creó el Test de Turing, una prueba diseñada para evaluar si una máquina puede imitar la conversación humana de forma indistinguible." },
      { t: "Nacimiento del Término", d: "John McCarthy define Inteligencia Artificial en Dartmouth (1956)", img: "img/pioneros.png", n: "El término 'Inteligencia Artificial' nació oficialmente en la conferencia de Dartmouth de 1956, liderada por John McCarthy." },
      { t: "Inviernos de la IA", d: "Recortes de financiamiento por expectativas infladas y hardware limitado", img: "img/invierno.png", n: "Sin embargo, vinieron los 'Inviernos de la IA': periodos de escepticismo y retiro de fondos porque la tecnología de la época no alcanzaba las expectativas." },
      { t: "El Renacimiento - 1980s", d: "Redes multicapa e introducción del algoritmo de retropropagación", img: "img/uniNeuroIA.png", n: "En los años 80, la retropropagación permitió entrenar redes de múltiples capas, reactivando el interés científico." },
      { t: "Desvanecimiento del Gradiente", d: "Pérdida de información en capas profundas solucionada en 2006", img: "img/cerebros81NeuroIA.png", n: "En 2006 se superaron las barreras matemáticas del desvanecimiento del gradiente, dando inicio a la era moderna del Deep Learning." },
      { t: "Arquitectura Transformer", d: "Publicación de 'Attention Is All You Need' en 2017", img: "img/atencion.png", n: "El gran salto cualitativo ocurrió en 2017 con la arquitectura Transformer, desarrollada por investigadores de Google." },
      { t: "Mecanismo de Atención", d: "Asignación de importancia contextual a cada palabra simultáneamente", img: "img/atencion.png", n: "Los Transformers introdujeron el mecanismo de atención, permitiendo procesar frases enteras y entender el contexto global de inmediato." },
      { t: "Modelos Generativos GPT", d: "OpenAI desarrolla la arquitectura GPT impulsando la IA generativa", img: "img/Leonardo_Vision_XL_A_wideangle_shot_of_various_futuristic_huma_2.jpg", n: "Esta arquitectura impulsó los modelos GPT, capaces de generar texto coherente y creativo a escala humana." },
      { t: "El Hito ChatGPT - 2022", d: "Cien millones de usuarios alcanzados en menos de dos meses", img: "img/chatbots.jpg", n: "El lanzamiento de ChatGPT en 2022 democratizó el acceso a la IA, convirtiéndose en la aplicación de más rápido crecimiento en la historia." },
      { t: "Evolución Agéntica", d: "Transición actual de respuestas conversacionales a acciones autónomas", img: "img/revolucion_generativa.jpg", n: "Hoy vivimos una nueva fase: estamos pasando de modelos que solo responden preguntas a sistemas agénticos que ejecutan tareas por sí mismos." },
      { t: "Modelos de Lenguaje", d: "Clasificación de arquitecturas según escala, potencia y despliegue", img: "img/modeloslen.jpg", n: "Analicemos la arquitectura actual y cómo se clasifican los modelos según sus dimensiones y propósitos." },
      { t: "LLM - Large Language Models", d: "Modelos masivos orientados a razonamiento complejo en la nube", img: "img/llm.jpg", n: "Los LLM o Grandes Modelos de Lenguaje cuentan con cientos de miles de millones de parámetros y residen en grandes centros de datos." },
      { t: "SLM - Small Language Models", d: "Modelos compactos eficientes para ejecución en dispositivos locales", img: "img/sml.jpg", n: "Por otro lado, los SLM o Modelos Pequeños están diseñados para ser ágiles y ejecutarse directamente en teléfonos o computadoras locales." },
      { t: "Comparativa LLM vs. SLM", d: "LLM ofrece razonamiento profundo; SLM prioriza latencia y privacidad", img: "img/sml.jpg", n: "Los LLM destacan en análisis complejos; los SLM ganan en velocidad, menor costo y máxima privacidad de los datos." },
      { t: "Arquitecturas Híbridas", d: "Combinación de procesamiento local SLM con potencia LLM nube", img: "img/modeloslen.jpg", n: "El futuro es híbrido: tareas cotidianas resueltas localmente por un SLM y consultas complejas derivadas a un LLM en la nube." },
      { t: "Agentes de IA", d: "Sistemas autónomos impulsados por metas sin supervisión constante", img: "img/Leonardo_Vision_XL_A_wideangle_shot_of_various_futuristic_huma_2.jpg", n: "Entramos de lleno en la era de los Agentes de IA: programas que reciben un objetivo y planifican los pasos para cumplirlo de forma autónoma." },
      { t: "Módulo de Percepción", d: "Procesamiento e interpretación de datos multimodales en tiempo real", img: "img/Absolute_Reality_v16_Illustrate_a_selfdriving_car_using_sensor_0.jpg", n: "Todo agente comienza con un módulo de percepción, capaz de procesar e interpretar imágenes, texto, audio y código." },
      { t: "Motor de Decisión", d: "Razonamiento lógico, planificación paso a paso y priorización de metas", img: "img/estrategias.png", n: "El motor de decisión es su cerebro: desglosa problemas complejos en sub-tareas lógicas y evalúa cuál es el mejor camino." },
      { t: "Sistema de Memoria", d: "Bancos contextuales a corto y largo plazo para aprendizaje continuo", img: "img/data.jpg", n: "Cuentan con sistemas de memoria que les permiten recordar interacciones pasadas y adaptar sus decisiones según la experiencia previa." },
      { t: "Uso de Herramientas", d: "Ejecución autónoma de APIs, código y sistemas externos", img: "img/herrami.jpg", n: "Su gran diferencial es la capacidad de usar herramientas: conectar con APIs, consultar bases de datos y ejecutar código informático." },
      { t: "Sistemas Multi-Agente", d: "Colaboración y coordinación entre múltiples agentes especializados", img: "img/desarrollo.jpg", n: "Además, los sistemas multi-agente permiten que varios agentes especializados colaboren entre sí para resolver proyectos complejos." },

      { t: "Ecosistema Generativo", d: "Herramientas avanzadas para texto, imagen, video, código y audio", img: "img/gencont.jpg", n: "Exploremos el ecosistema de herramientas generativas que están transformando la producción creativa y profesional." },
      { t: "Chatbots Avanzados", d: "ChatGPT, Gemini 3.8 Flash, Claude y Qwen liderando razonamiento avanzado", img: "img/chatbots.jpg", n: "En el ámbito del texto y razonamiento, plataformas como ChatGPT, Gemini y Claude lideran el análisis conversacional." },
      { t: "Generación de Imágenes", d: "Midjourney, DALL-E y Firefly para creación visual fotorrealista", img: "img/gencont.jpg", n: "Para generación visual, modelos como Midjourney y DALL-E permiten convertir descripciones de texto en imágenes fotorrealistas." },
      { t: "Generación de Video", d: "Sora2, Kling y Runway transformando la producción audiovisual profesional", img: "img/media.jpg", n: "En video, herramientas como Sora2 y Runway generan secuencias cinemáticas de alta fidelidad con física realista." },
      { t: "Generación de Música", d: "Suno creando composiciones musicales completas mediante texto", img: "img/suno_musica.jpg", n: "La música también se ha democratizado: plataformas como Suno componen canciones completas con instrumentación y voz a partir de una instrucción." },
      { t: "Asistentes de Código", d: "Cursor, Windsurf y Copilot automatizando desarrollo de software", img: "img/desarrollo.jpg", n: "En el desarrollo de software, editores como Cursor y GitHub Copilot actúan como compañeros de programación en tiempo real." },
      { t: "Investigación y Síntesis", d: "Perplexity y NotebookLM para búsqueda y análisis documentado", img: "img/investigacion.jpg", n: "Para investigación y síntesis, Perplexity y NotebookLM permiten examinar documentos complejos citando fuentes verificables." },

    let currentIndex = 0;
    const total = slides.length;
    let notesVisible = false;

    const titleEl = document.getElementById("slideTitle");
    const descEl = document.getElementById("slideDesc");
    const imgEl = document.getElementById("slideImg");
    const cardEl = document.getElementById("slideCard");
    const counterEl = document.getElementById("counter");
    const progressEl = document.getElementById("progressBar");
    const notesDrawer = document.getElementById("speakerNotes");
    const notesText = document.getElementById("notesText");
    const tagEl = document.getElementById("slideTag");
    const fsIcon = document.getElementById("fsIcon");
    const fsText = document.getElementById("fsText");

    function handleImageError(img) {
      img.onerror = null;
      img.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='800' height='600' viewBox='0 0 800 600'><rect width='800' height='600' fill='%230f172a'/><circle cx='400' cy='300' r='120' fill='%239b5de5' opacity='0.3'/><text x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-size='26' fill='%2300f5d4' font-weight='bold'>INTELIGENCIA ARTIFICIAL</text></svg>";
    }

    function renderSlide(index) {
      const data = slides[index];

      // Alternancia de diseño: par derecha, impar izquierda
      cardEl.className = "slide-wrapper " + (index % 2 === 0 ? "layout-right" : "layout-left");

      titleEl.innerText = data.t;
      descEl.innerText = data.d;
      
      imgEl.style.opacity = "0.2";
      imgEl.src = data.img;
      imgEl.onload = () => { imgEl.style.opacity = "1"; };

      notesText.innerText = data.n;
      counterEl.innerText = `${index + 1} / ${total}`;
      tagEl.innerText = `SECCIÓN ${(index + 1).toString().padStart(2, '0')}`;
      progressEl.style.width = `${((index + 1) / total) * 100}%`;
    }

    function nextSlide() {
      if (currentIndex < total - 1) {
        currentIndex++;
        renderSlide(currentIndex);
      }
    }

    function prevSlide() {
      if (currentIndex > 0) {
        currentIndex--;
        renderSlide(currentIndex);
      }
    }

    function toggleNotes() {
      notesVisible = !notesVisible;
      notesDrawer.classList.toggle("visible", notesVisible);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen();
        } else if (document.documentElement.webkitRequestFullscreen) {
          document.documentElement.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    function updateFullscreenUI() {
      const isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement);
      if (isFullscreen) {
        fsIcon.innerText = "🗗";
        fsText.innerText = "Salir";
      } else {
        fsIcon.innerText = "⛶";
        fsText.innerText = "Pantalla Completa";
      }
    }

    document.addEventListener("fullscreenchange", updateFullscreenUI);
    document.addEventListener("webkitfullscreenchange", updateFullscreenUI);

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
        nextSlide();
      } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
        prevSlide();
      } else if (e.key.toLowerCase() === "n") {
        toggleNotes();
      } else if (e.key.toLowerCase() === "f") {
        toggleFullscreen();
      }
    });

    let touchStartX = 0;
    let touchEndX = 0;
    document.addEventListener("touchstart", (e) => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
    document.addEventListener("touchend", (e) => {
      touchEndX = e.changedTouches[0].screenX;
      const diff = touchStartX - touchEndX;
      if (Math.abs(diff) > 50) {
        if (diff > 0) nextSlide();
        else prevSlide();
      }
    }, { passive: true });

    renderSlide(0);
  </script>

<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>La Magia de la IA: De Teoría a Agentes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #fee440;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      padding: 20px 15px 90px 15px;
      color-scheme: light dark;
    }

    /* Fondo animado SVG */
    svg.bg-blobs {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1;
      pointer-events: none;
    }
    @keyframes rotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .out-top { animation: rotate 20s linear infinite; transform-origin: 13px 25px; }
    .in-top { animation: rotate 10s linear infinite; transform-origin: 13px 25px; }
    .out-bottom { animation: rotate 25s linear infinite; transform-origin: 84px 93px; }
    .in-bottom { animation: rotate 15s linear infinite; transform-origin: 84px 93px; }

    /* Barra de progreso */
    .progress-bar-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 6px;
      background: var(--progress); z-index: 50;
    }
    .progress-bar { height: 100%; background: var(--progress); width: 0%; transition: width 0.3s ease; }

    /* Tarjeta principal */
    .slide-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1150px;
      min-height: 520px;
      height: 80vh;
      max-height: 750px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 24px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.18);
      border: 2px solid rgba(255, 255, 255, 0.65);
      display: flex;
      overflow: hidden;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    .layout-right { flex-direction: row; }
    .layout-left { flex-direction: row-reverse; }

    .layout-full { flex-direction: row; }
    .slide-wrapper.layout-full .content-box { display: none; }
    .slide-wrapper.layout-full .image-box { flex: 1; width: 100%; min-width: 100%; }
    .slide-wrapper.layout-full .image-box img { object-fit: contain; }

    :root {
      --bg: #fee440;
      --card: rgba(255, 255, 255, 0.92);
      --text: #0f172a;
      --progress: #9b5de5;
      --border: rgba(255, 255, 255, 0.65);
    }
    [data-theme="dark"] {
      --bg: #0f172a;
      --card: rgba(15, 23, 42, 0.92);
      --text: #f1f5f9;
      --progress: #a78bfa;
      --border: rgba(255, 255, 255, 0.35);
    }

    /* Bloque de texto */
    .content-box {
      flex: 1.15;
      padding: clamp(24px, 4vw, 50px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow-y: auto;
    }

    .slide-number {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 20;
      font-size: 14px;
      font-weight: 800;
      color: #ffffff;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.35);
      padding: 4px 12px;
      border-radius: 999px;
      letter-spacing: 1px;
      pointer-events: none;
    }

    h1 {
      font-size: clamp(24px, 3.2vw, 42px);
      color: #0f172a;
      line-height: 1.22;
      margin-bottom: 18px;
      font-weight: 800;
    }

    p.description {
      font-size: clamp(16px, 1.8vw, 24px);
      color: #334155;
      line-height: 1.5;
      font-weight: 500;
    }

    /* Bloque de imagen */
    .image-box {
      flex: 1;
      width: 50%;
      min-width: 40%;
      height: 100%;
      background: #0f172a;
      position: relative;
      overflow: hidden;
    }

    .image-box img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      transition: opacity 0.3s ease;
    }

    /* Guión del orador */
    .speaker-notes-drawer {
      margin-top: 18px;
      padding: 14px 18px;
      background: rgba(241, 245, 249, 0.96);
      border-left: 4px solid #00bbf9;
      border-radius: 8px;
      font-size: 14px;
      color: #1e293b;
      line-height: 1.5;
      display: none;
      max-height: 180px;
      overflow-y: auto;
    }
    .speaker-notes-drawer.visible { display: block; }
    .speaker-notes-drawer strong { color: #0284c7; }

    /* Controles */
    .controls {
      position: fixed;
      bottom: 16px;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 8px 18px;
      border-radius: 50px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    button.nav-btn {
      background: #0f172a;
      color: #ffffff;
      border: none;
      width: 40px; height: 40px;
      border-radius: 50%;
      font-size: 17px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }
    button.nav-btn:hover { background: #9b5de5; transform: scale(1.08); }

    .btn-action {
      background: #f1f5f9;
      color: #0f172a;
      border: 1px solid #cbd5e1;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-action:hover { background: #e2e8f0; }

    .slide-counter { font-size: 14px; font-weight: 700; color: #0f172a; min-width: 65px; text-align: center; }

    @media (max-width: 850px) {
      body { justify-content: flex-start; padding: 16px 12px 85px 12px; overflow-y: auto; }
      .slide-wrapper { height: auto; min-height: auto; max-height: none; flex-direction: column !important; }
      .image-box { width: 100%; min-width: 100%; height: 230px; order: 1; }
      .content-box { width: 100%; padding: 22px 18px; order: 2; }
      .btn-action span.label-text { display: none; }
    }
  </style>
</head>

  <script>
    // 88 DIAPOSITIVAS CON NOTAS DE CÁTEDRA BASADAS EN EL MANUAL TEÓRICO (EDICIÓN 2026)
    const slides = [
      { t: "La Magia de la IA", d: "De Teoría a Agentes", img: "img/Ilustration_V2_Create_an_image_to_represent_a_magic_of_IA_0.jpg", 
        n: "Bienvenidos a la cátedra. Hoy desmitificaremos la Inteligencia Artificial: combinaremos rigor científico de neurociencia y matemáticas con anécdotas históricas, desde cómo aprende una neurona hasta los agentes autónomos y la regulación de 2026." },
      
      { t: "Introducción", d: "Conceptos clave para comprender la revolución inteligente actual", img: "img/3D_Animation_Style_Create_an_image_illustrating_the_concept_of_0.jpg", 
        n: "Para entender la IA sin caer en ciencia ficción, primero debemos hacer una comparativa honesta entre el 'hardware biológico' que llevamos entre las orejas y el 'hardware de silicio' de los servidores y GPUs." },
      
      { t: "¿Qué es la Inteligencia?", d: "Capacidad mental de procesar, comprender, aplicar y adaptar conocimiento", img: "img/Ilustration_V2_Create_an_image_to_represent_a_magic_of_Generat_0.jpg", 
        n: "La inteligencia no es solo almacenar datos como un disco duro; es la capacidad activa de adquirir, procesar, comprender, aplicar y adaptar ese conocimiento ante entornos imprevistos." },
      
      { t: "Neurona Biológica", d: "El cerebro humano procesa información mediante 86 mil millones de neuronas", img: "img/ilustracion-que-muestra-los-4-tipos-de-neuronas-de-izquierda-a-derecha-unipolar-bipolar-multipolar-y-piramidal-g157be.jpg", contain: true, 
        n: "El cerebro humano cuenta con 86 mil millones de neuronas conectadas por más de 100 billones de sinapsis electroquímicas masivamente paralelas. Su arquitectura es pura maravilla evolutiva." },
      
      { t: "Biología vs. Computación", d: "Billones de sinapsis biológicas superan la complejidad actual sintética", img: "img/Absolute_Reality_v16_A_with_neuron_synapsis_like_a_scientific_0.jpg", 
        n: "¡Dato brutal del manual!: Tu cerebro gasta apenas 20 Watts (lo que consume un foco de cocina). En cambio, entrenar y correr redes sintéticas requiere megavatios enteros de centros de datos en la nube. La biología sigue siendo el pináculo de la eficiencia." },
      
      { t: "¿Qué es la IA?", d: "Algoritmos que permiten a máquinas analizar datos y decidir", img: "img/3D_Animation_Style_Generate_an_image_representing_the_concept_0.jpg", 
        n: "La IA consiste en algoritmos y matrices matemáticas ejecutadas en chips que emulan esta capacidad biológica: analizan datos, aprenden patrones y toman decisiones sin requerir reglas fijas programadas a mano." },
      
      { t: "Funcionamiento de la IA", d: "Sistemas que reconocen patrones complejos y aprenden de datos", img: "img/DreamShaper_v7_Illustrate_the_process_of_How_AI_Works_showing_0.jpg", 
        n: "A diferencia del software clásico (donde un programador escribe cada 'si pasa esto, haz aquello'), la IA aprende inductivamente: le das millones de ejemplos y ella sola deduce los patrones ocultos." },
      
      { t: "La Neurona Artificial", d: "Unidad básica matemática que procesa y pondera entradas numéricas", img: "img/Absolute_Reality_v16_An_artificial_neuron_from_IA_0.jpg", 
        n: "La neurona artificial (perceptrón) es simplemente una ecuación lineal vestida de gala: multiplica entradas (x) por 'pesos' (w), suma un sesgo o bias (b) y pasa el resultado por una función de activación (ReLU, Sigmoide) que decide si 'dispara' o se queda callada." },
      
      { t: "Redes Neuronales", d: "Capas interconectadas de nodos procesando información en paralelo", img: "img/neuroIA.png", contain: true, 
        n: "Al conectar miles de estas ecuaciones en capas secuenciales, creamos una red neuronal capaz de realizar multiplicaciones masivas de matrices en paralelo sobre tarjetas gráficas (GPUs)." },
      
      { t: "Función de Pérdida / Loss", d: "Medida matemática del error entre predicción y valor real", img: "img/data.jpg", 
        n: "Analogía de la salsa (del manual): Los pesos (w) son cucharadas de condimento. La Función de Pérdida (Loss) es el grito de tu abuelita al probar la salsa diciendo: '¡Le falta sal y pica como el demonio!'. Mide matemáticamente qué tan lejos estás de la receta perfecta." },
      
      { t: "Cerebro artificial más sencillo", d: "", img: "img/uniNeuroIA.png", n: "", contain: true },
      
      { t: "", d: "", img: "img/cerebros35NeuroIA.png", n: "", full: true },
      
      { t: "", d: "", img: "img/cerebros66NeuroIA.png", n: "", full: true },
      
      { t: "", d: "", img: "img/cerebros8NeuroIA.png", n: "", full: true },
      
      { t: "", d: "", img: "img/cerebros81NeuroIA.png", n: "", full: true },
      
      { t: "Machine Learning", d: "Algoritmos que optimizan parámetros automáticamente a partir de datos", img: "img/Absolute_Reality_v16_Generate_an_image_illustrating_the_concep_0.jpg", 
        n: "El Descenso de Gradiente es ir ajustando la receta paso a pasito; Backpropagation es la regla de la cadena que calcula exactamente cuántas pizcas de sal mover hasta que la abuelita diga: 'Quedó perfecta'." },
      
      { t: "Deep Learning", d: "Aprendizaje profundo mediante múltiples capas ocultas de abstracción", img: "img/neuronas-161445.jpg", 
        n: "El Deep Learning añade decenas de capas ocultas. Cuidado con las dos tragedias del entrenamiento: Overfitting (el alumno que memoriza exámenes viejos de pe a pa y reprueba si cambias una coma) y Underfitting (el que ni entendió la clase)." },
      
      { t: "Historia de la IA", d: "Orígenes teóricos y grandes hitos de la computación inteligente", img: "img/historia_ia_1950_turing.jpg", 
        n: "Como dice el manual: La historia de la IA no es una línea recta de triunfos; es una telenovela dramática llena de promesas exageradas, presupuestos cancelados y avances inesperados." },
      
      { t: "Los Inicios - 1950s", d: "Alan Turing propone computadoras capaces de pensamiento humano", img: "img/historia_ia_1950_turing.jpg", 
        n: "Chisme histórico #1: En 1950 Alan Turing estaba harto de que los filósofos discutieran qué demonios significaba 'pensar'. Decidió saltarse la metafísica y propuso el 'Juego de la Imitación'." },
      
      { t: "El Test de Turing", d: "Evaluación de imitación conversacional entre humano y máquina", img: "img/test_de_turing.jpg", 
        n: "La premisa de Turing fue tajante: Si una persona conversa a través de un teletipo con una máquina y no logra distinguir si habla con un humano o un programa, la máquina es inteligente y punto." },
      
      { t: "Nacimiento del Término", d: "John McCarthy define Inteligencia Artificial en Dartmouth (1956)", img: "img/nacimiento_termino_dartmouth.jpg", 
        n: "Verano de 1956: McCarthy, Marvin Minsky, Claude Shannon y Rochester se reúnen en Dartmouth College. Eufóricos, juraron que en un solo verano con 10 hombres lograrían que una máquina usara lenguaje. Pecaron de optimistas." },
      
      { t: "Inviernos de la IA", d: "Recortes de financiamiento por expectativas infladas y hardware limitado", img: "img/invierno.png", 
        n: "El optimismo sin freno trajo los 'Inviernos de la IA' (los 70 y late 80). Tras el devastador Informe Lighthill de 1973 en Reino Unido y recortes de DARPA, se retiraron fondos porque la IA era 'más promesa que realidad'." },
      
      { t: "El Renacimiento - 1980s", d: "Redes multicapa e introducción del algoritmo de retropropagación", img: "img/renacimiento_1980s_redes_multicapa.jpg",

      { t: "Desvanecimiento del Gradiente", d: "Pérdida de información en capas profundas solucionada en 2006", img: "img/Absolute_Reality_v16_Create_an_image_illustrating_a_virtual_as_0.jpg", 
        n: "Al apilar muchas capas, la señal matemática se desvanecía (Gradient Vanishing). En 2006, Geoffrey Hinton demostró cómo pre-entrenar redes profundas capa por capa, inaugurando oficialmente la era moderna del Deep Learning." },
      
      { t: "Arquitectura Transformer", d: "Publicación de 'Attention Is All You Need' en 2017", img: "img/transformer_arquitectura.jpg", 
        n: "El terremoto definitivo ocurrió en junio de 2017 con investigadores de Google. Tiraron a la basura las redes recurrentes (RNNs) que leían palabra por palabra de forma lenta, e introdujeron el Transformer." },
      
      { t: "Mecanismo de Atención", d: "Asignación de importancia contextual a cada palabra simultáneamente", img: "img/atencion.png",

      { t: "Modelos Generativos GPT", d: "OpenAI desarrolla la arquitectura GPT impulsando la IA generativa", img: "img/modelos_gpt_generativos.jpg",

      { t: "El Hito ChatGPT - 2022", d: "Cien millones de usuarios alcanzados en menos de dos meses", img: "img/chatgpt_hito_2022.jpg", 
        n: "Chisme histórico #2: El 30 de noviembre de 2022 OpenAI lanzó ChatGPT casi como un 'experimento de bajo perfil' con GPT-3.5. Ni ellos previeron el bombazo: 100 millones de usuarios en menos de 2 meses, desatando la carrera tecnológica actual." },
      
      { t: "Evolución Agéntica", d: "Transición actual de respuestas conversacionales a acciones autónomas", img: "img/sistemas_multiagente.jpg",

      { t: "Modelos de Lenguaje", d: "Clasificación de arquitecturas según escala, potencia y despliegue", img: "img/modeloslen.jpg",

      { t: "LLM - Large Language Models", d: "Modelos masivos orientados a razonamiento complejo en la nube", img: "img/llm.jpg",

      { t: "Motor de Decisión", d: "Razonamiento lógico, planificación paso a paso y priorización de metas", img: "img/motor_decision.jpg",

    function showHelp() {
      const overlay = document.createElement('div');
      overlay.style.position = 'fixed';
      overlay.style.top = 0;
      overlay.style.left = 0;
      overlay.style.width = '100%';
      overlay.style.height = '100%';
      overlay.style.background = 'rgba(0, 0, 0, 0.85)';
      overlay.style.color = '#fff';
      overlay.style.zIndex = 100;
      overlay.style.display = 'flex';
      overlay.style.flexDirection = 'column';
      overlay.style.alignItems = 'center';
      overlay.style.justifyContent = 'center';
      overlay.style.padding = '20px';
      
      const title = document.createElement('h2');
      title.style.marginBottom = '20px';
      title.style.color = '#9b5de5';
      title.innerText = 'Atajos de Teclado';
      
      const shortcutsList = document.createElement('div');
      shortcutsList.style.textAlign = 'left';
      shortcutsList.style.maxWidth = '80%';
      shortcutsList.innerHTML = `
        <div>← / PageUp</div> <span>Anterior diapositiva</div>
        <div>→ / Space / PageDown</div> <span>Siguiente diapositiva</div>
        <div>N</div> <span>Mostrar/ocultar notas</div>
        <div>F</div> <span>Pantalla completa</div>
        <div>T</div> <span>Cambiar modo (claro/oscuro)</div>
        <div>H / ?</div> <span>Mostrar este menú</div>
      `;
      
      const closeBtn = document.createElement('button');
      closeBtn.style.marginTop = '20px';
      closeBtn.style.background = '#0f172a';
      closeBtn.style.color = '#fff';
      closeBtn.style.border = 'none';
      closeBtn.style.padding = '10px 20px';
      closeBtn.style.borderRadius = '8px';
      closeBtn.style.cursor = 'pointer';
      closeBtn.innerText = 'Cerrar';
      closeBtn.onclick = () => overlay.remove();
      
      overlay.appendChild(title);
      overlay.appendChild(shortcutsList);
      overlay.appendChild(closeBtn);
      document.body.appendChild(overlay);
    }

    let currentIndex = 0;
    const total = slides.length;
    let notesVisible = false;

    const titleEl = document.getElementById("slideTitle");
    const descEl = document.getElementById("slideDesc");
    const imgEl = document.getElementById("slideImg");
    const cardEl = document.getElementById("slideCard");
    const counterEl = document.getElementById("counter");
    const progressEl = document.getElementById("progressBar");
    const notesDrawer = document.getElementById("speakerNotes");
    const notesText = document.getElementById("notesText");
    const numberEl = document.getElementById("slideNumber");
    const fsIcon = document.getElementById("fsIcon");
    const fsText = document.getElementById("fsText");

    function handleImageError(img) {
      img.onerror = null;
      img.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='800' height='600' viewBox='0 0 800 600'><rect width='800' height='600' fill='%230f172a'/><circle cx='400' cy='300' r='120' fill='%239b5de5' opacity='0.3'/><text x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-size='26' fill='%2300f5d4' font-weight='bold'>INTELIGENCIA ARTIFICIAL</text></svg>";
    }

    function renderSlide(index) {
      const data = slides[index];

      cardEl.className = data.full ? "slide-wrapper layout-full" : "slide-wrapper " + (index % 2 === 0 ? "layout-right" : "layout-left");

      titleEl.innerText = data.t;
      descEl.innerText = data.d;
      
      imgEl.style.opacity = "0.2";
      imgEl.style.objectFit = (data.contain || data.full) ? "contain" : "cover";
      imgEl.src = data.img;
      imgEl.onload = () => { imgEl.style.opacity = "1"; };

      notesText.innerText = data.n;
      counterEl.innerText = `${index + 1} / ${total}`;
      numberEl.innerText = (index + 1).toString().padStart(2, '0');
      progressEl.style.width = `${((index + 1) / total) * 100}%`;
    }

    function nextSlide() {
      if (currentIndex < total - 1) {
        currentIndex++;
        renderSlide(currentIndex);
      }
    }

    function prevSlide() {
      if (currentIndex > 0) {
        currentIndex--;
        renderSlide(currentIndex);
      }
    }

    function toggleNotes() {
      notesVisible = !notesVisible;
      notesDrawer.classList.toggle("visible", notesVisible);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen();
        } else if (document.documentElement.webkitRequestFullscreen) {
          document.documentElement.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    function updateFullscreenUI() {
      const isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement);
      if (isFullscreen) {
        fsIcon.innerText = "🗗";
        fsText.innerText = "Salir";
      } else {
        fsIcon.innerText = "⛶";
        fsText.innerText = "Pantalla Completa";
      }
    }

    document.addEventListener("fullscreenchange", updateFullscreenUI);
    document.addEventListener("webkitfullscreenchange", updateFullscreenUI);

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
        nextSlide();
      } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
        prevSlide();
      } else if (e.key.toLowerCase() === "n") {
        toggleNotes();
      } else if (e.key.toLowerCase() === "f") {
        toggleFullscreen();
      } else if (e.key.toLowerCase() === "h" || e.key === "?") {
        showHelp();
      }
    });

    let touchStartX = 0;
    let touchEndX = 0;
    document.addEventListener("touchstart", (e) => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
    document.addEventListener("touchend", (e) => {
      touchEndX = e.changedTouches[0].screenX;
      const diff = touchStartX - touchEndX;
      if (Math.abs(diff) > 50) {
        if (diff > 0) nextSlide();
        else prevSlide();
      }
    }, { passive: true });

    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.getAttribute('data-theme') === 'dark';
      html.setAttribute('data-theme', isDark ? null : 'dark');
      const icon = document.getElementById('themeIcon');
      const text = document.querySelector('.btn-action span.label-text');
      if (isDark) {
        icon.innerText = '☀️';
        text.innerText = 'Modo';
        html.removeAttribute('color-scheme');
      } else {
        icon.innerText = '🌙';
        text.innerText = 'Oscuro';
        html.setAttribute('color-scheme', 'dark');
      }
    }

    renderSlide(0);
  </script>
</body>
</html>
